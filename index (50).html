:root{
  --ink:#0b2f27;--leaf:#0f4d3f;--moss:#17694f;--sprout:#7ed957;--lemon:#ffd23f;--coral:#ff6b4a;
  --sky:#8fe3ff;--cream:#fff3d2;--paper:#fffaf0;--bad:#e23d28;--plum:#3b2340;
  --disp:'DynaPuff','Trebuchet MS',sans-serif;--text:'Lexend','Segoe UI',system-ui,sans-serif;
  --band:var(--leaf);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--leaf);color:var(--cream);font-family:var(--text);font-size:17px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
#app{height:100vh;height:100dvh;overflow:hidden}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.12);flex:none}

  let cl='';for(let j=0;j<H;j++)for(let i=0;i<W;i++){const g=(i+','+j) in giv;cl+=`<g class="cell" data-x="${i}" data-y="${j}"><rect class="tile" id="c${i}_${j}" x="${i*s+2}" y="${j*s+2}" width="${s-4}" height="${s-4}" rx="7" ${g?`style="fill:${COL[giv[i+','+j]]}"`:''}/></g>`}
  const ln=dir==='v'?`M${ax*s} -8V${H*s+8}`:`M-8 ${ax*s}H${W*s+8}`;
  c.stage.innerHTML=`<svg viewBox="-10 -10 ${W*s+20} ${H*s+20}" aria-label="Štvorcová sieť">${cl}<path d="${ln}" stroke="#e23d28" stroke-width="6" stroke-dasharray="14 9"/></svg>`;const svg=$('svg',c.stage);
  const sq=(i,j)=>$(`#c${i}_${j}`,svg);
  const set=(k,v)=>{const[i,j]=k.split(',').map(Number);if(v===undefined){delete mine[k];sq(i,j).style.fill=''}else{mine[k]=v;sq(i,j).style.fill=COL[v]}};
  let end=false;svg.addEventListener('click',e=>{const g=e.target.closest('.cell');if(!g||end)return;const k=g.dataset.x+','+g.dataset.y;if(k in giv)return;tick();if(k in mine&&mine[k]===pen)set(k);else set(k,pen)});
  if(cols>1){const w=div('nextw',COL.map((f,i)=>`<button class="pal" data-p="${i}" aria-pressed="${i===0}" aria-label="Farba ${i+1}" style="background:${f}"></button>`).join(''));c.tools.append(w);w.onclick=e=>{const b=e.target.closest('.pal');if(!b)return;pen=+b.dataset.p;$$('.pal',w).forEach(q=>q.setAttribute('aria-pressed',q===b))}}
  c.say(dir==='v'?'Dokresli druhú polovicu. Čo je pri osi, ostane pri osi.':'Dokresli obraz podľa vodorovnej osi, ako odraz v jazierku.');
  btn(c,'Hotovo',()=>{if(end)return;const a=Object.keys(mine).sort().join(';'),b=Object.keys(tar).sort().join(';');
    if(a===b&&Object.keys(tar).every(k=>mine[k]===tar[k])){end=true;c.win('Každý štvorček má svoj obraz rovnako ďaleko od osi.');return}
    const keys=Object.keys(giv).map(k=>k.split(',').map(Number)),trans=keys.every(([i,j])=>{const dd=dir==='v'?ax:0,d2_=dir==='h'?ax:0;return ((i+dd)+','+(j+d2_)) in mine})&&Object.keys(mine).length===keys.length;
    c.fail(trans?'Toto je posunutý obrázok, nie zrkadlový. Štvorček pri osi musí byť aj na druhej strane pri osi.':'Vyber si jeden štvorček a spočítaj, ako ďaleko je od osi. Jeho obraz je rovnako ďaleko.')});
  c.setSol(()=>{Object.keys(mine).forEach(k=>set(k));Object.entries(tar).forEach(([k,v])=>set(k,v));end=true;c.win('Takto vyzerá obraz. Porovnaj vzdialenosti od osi.')});
};
RUN.mozaika=c=>{
  const l=c.lvl,r=c.round,n=6,s=70,hand=l===3&&r===1,two=l>=2,COL=['#ff6b4a','#ffd23f','#2f9fd0','#7ed957','#b16cdb'];
  const m=Array(n*n).fill(-1),giv=new Set();let pen=0;
  if(hand){for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(rnd(3)){const k=y*n+x;m[k]=rnd(5);giv.add(k)}}
  let cl='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)cl+=`<g class="cell" data-x="${x}" data-y="${y}"><rect class="tile" id="m${x}_${y}" x="${x*s+2}" y="${y*s+2}" width="${s-4}" height="${s-4}" rx="9"/></g>`;
  const ax=`<path d="M${n*s/2} -8V${n*s+8}" stroke="#e23d28" stroke-width="5" stroke-dasharray="13 9"/>${two?`<path d="M-8 ${n*s/2}H${n*s+8}" stroke="#e23d28" stroke-width="5" stroke-dasharray="13 9"/>`:''}`;
  c.stage.innerHTML=`<svg viewBox="-10 -10 ${n*s+20} ${n*s+20}" aria-label="Mozaika">${cl}${ax}</svg>`;const svg=$('svg',c.stage);
  const paint=()=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=m[y*n+x];$(`#m${x}_${y}`,svg).style.fill=v<0?'':COL[v]}};paint();
  svg.addEventListener('click',e=>{const g=e.target.closest('.cell');if(!g)return;const x=+g.dataset.x,y=+g.dataset.y,k=y*n+x;if(giv.has(k))return;tick();const v=m[k]===pen?-1:pen;const pts=hand?[[x,y]]:two?[[x,y],[n-1-x,y],[x,n-1-y],[n-1-x,n-1-y]]:[[x,y],[n-1-x,y]];pts.forEach(([a,b])=>m[b*n+a]=v);paint()});
  const pal=div('nextw',COL.map((f,i)=>`<button class="pal" data-p="${i}" aria-pressed="${i===0}" aria-label="Farba ${i+1}" style="background:${f}"></button>`).join(''));c.tools.append(pal);pal.onclick=e=>{const b=e.target.closest('.pal');if(!b)return;pen=+b.dataset.p;$$('.pal',pal).forEach(q=>q.setAttribute('aria-pressed',q===b))};
  c.say(hand?'Dokončí sa to len tvojou rukou: doplň mozaiku podľa oboch osí.':two?'Ťukaj a tvor. Mozaika sa zrkadlí podľa oboch osí.':'Ťukaj a tvor. Mozaika sa sama zrkadlí podľa osi.');
  const okSym=()=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=m[y*n+x];if(v!==m[y*n+n-1-x]||(two&&v!==m[(n-1-y)*n+x]))return false}return true};
  btn(c,'Hotovo',()=>{const cnt=m.filter(v=>v>=0).length,cols=new Set(m.filter(v=>v>=0)).size;if(hand&&!okSym()){c.fail('Porovnaj štvorčeky na oboch stranách osi.');return}if(cnt<8||cols<2){c.fail('Pridaj ešte kúsky aspoň dvoch farieb.');return}S.mosaic=m.map(v=>v<0?'':COL[v]);save();c.win('Krásna mozaika! Pribudla do parku v Tvaríkove.')});
  c.setSol(()=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=m[y*n+x];if(v>=0&&m[y*n+n-1-x]<0)m[y*n+n-1-x]=v;if(v>=0&&m[(n-1-y)*n+x]<0)m[(n-1-y)*n+x]=v}for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=m[y*n+x];if(v>=0)m[(n-1-y)*n+(n-1-x)]=v,m[y*n+n-1-x]=v,m[(n-1-y)*n+x]=v}if(m.filter(v=>v>=0).length<8){[0,1].forEach(i=>{[0,n-1].forEach(a=>[0,n-1].forEach(b=>m[Math.abs(b-i)*n+Math.abs(a-i)]=i+1))})}paint();S.mosaic=m.map(v=>v<0?'':COL[v]);save();c.win('Takto je mozaika súmerná.')});
};
function mriezka(c){
  const n=5,u=100,m=60,a=rnd(n),b=rnd(n),L='ABCDE',X=i=>m+i*u,Y=j=>m+(n-1-j)*u;
  let g='';for(let i=0;i<n;i++)g+=`<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(n-1)}" stroke="#fff" stroke-width="4"/><line x1="${X(0)}" y1="${Y(i)}" x2="${X(n-1)}" y2="${Y(i)}" stroke="#fff" stroke-width="4"/><text x="${X(i)}" y="${Y(0)+46}" text-anchor="middle" style="font:700 36px var(--disp);fill:#fff3d2">${L[i]}</text><text x="${X(0)-34}" y="${Y(i)+13}" text-anchor="middle" style="font:700 36px var(--disp);fill:#fff3d2">${i+1}</text>`;
  c.stage.innerHTML=`<svg viewBox="0 0 ${m+n*u} ${m+n*u+20}" aria-label="Mriežka">${g}${Array.from({length:n*n},(_,q)=>{const i=q%n,k=Math.floor(q/n);return `<circle class="cell" data-i="${i}" data-j="${k}" aria-label="${L[i]}${k+1}" cx="${X(i)}" cy="${Y(k)}" r="46" fill="transparent"/>`}).join('')}<g id="dw" pointer-events="none"></g></svg>`;const svg=$('svg',c.stage),dw=$('#dw',svg);
  c.tools.innerHTML='<p class="hintline">Ťukni tam, kde sa čiary pretínajú.</p>';
  c.say(`Teraz nehľadáme políčko, ale [[mriežkový bod]]. Rosa je na bode ${L[a]}${b+1}. Ťukni naň.`);let end=false;
  const hit=(i,j)=>{if(end)return;if(i===a&&j===b){end=true;dw.innerHTML=`<circle class="pop" cx="${X(a)}" cy="${Y(b)}" r="20" fill="#8fe3ff" stroke="#fff" stroke-width="4"/>`;c.win(`Áno! ${L[a]}${b+1} je bod, kde sa pretína zvislá čiara ${L[a]} a vodorovná čiara ${b+1}.`)}else{dw.innerHTML=`<line class="pulse" x1="${X(a)}" y1="${Y(0)}" x2="${X(a)}" y2="${Y(n-1)}" stroke="#8fe3ff" stroke-width="9"/><line class="pulse" x1="${X(0)}" y1="${Y(b)}" x2="${X(n-1)}" y2="${Y(b)}" stroke="#ffd23f" stroke-width="9"/>`;c.fail(`To je bod ${L[i]}${j+1}. Hľadáme, kde sa pretínajú čiary ${L[a]} a ${b+1}.`)}};
  svg.addEventListener('click',e=>{const t=e.target.closest('.cell');if(t)hit(+t.dataset.i,+t.dataset.j)});
  c.setSol(()=>hit(a,b));
}

const WQ={
 cesta:['Dve cesty vedú k omrvinke. Prvá má 6 šípok, druhá 9 šípok. Ktorá je kratšia a prečo?',['Prvá, lebo každá šípka je jeden krok.','Druhá, lebo má viac šípok.','Sú rovnaké, lebo vedú k tej istej omrvinke.'],'Áno. Dĺžku cesty určuje počet krokov.'],
 kvet:['Prečo B3 určí jedno políčko, ale samotné B nie?',['Lebo B je celý stĺpec a až číslo vyberie riadok.','Lebo písmeno B je v abecede druhé.','Lebo políčko B je väčšie.'],'Áno. Až stĺpec a riadok spolu určia jedno políčko.'],
 tvary:['Ema tvrdí: Keď štvorec otočím, už to nie je štvorec. Má pravdu?',['Nemá. Dĺžky strán aj rohy sa otočením nezmenia.','Má. Štvorec musí ležať rovno.','Má. Otočený štvorec má viac vrcholov.'],'Áno. O tvare rozhodujú vlastnosti, nie poloha.'],
 rysuj:['Prečo sú všetky body kružnice rovnako ďaleko od stredu?',['Lebo kružidlo je celý čas rovnako roztvorené.','Lebo kružnica je okrúhla ako koleso.','Lebo sme rysovali pomaly.'],'Áno. Roztvorenie kružidla je polomer.'],
 telesa:['Prečo sa valec po doske kotúľa a kocka nie?',['Valec má okrúhly plášť, kocka má rovné steny.','Valec je ťažší ako kocka.','Kocka je menšia ako valec.'],'Áno. Rozhoduje tvar plochy, ktorá sa dotýka dosky.'],
 stavba:['V pláne sú čísla 2, 1 a 3. Prečo má stavba 6 kociek?',['Lebo každé číslo je počet kociek na sebe a sčítame ich.','Lebo sú tam tri čísla a najväčšie je 3.','Lebo stavba má 6 stien.'],'Áno. Počet kociek je súčet čísel v pláne.'],
 chyba:['Prečo sa zo šiestich štvorcov v jednom rade nedá zložiť kocka?',['Dva štvorce by sa zložili na to isté miesto a dve steny by chýbali.','Lebo štvorcov je príliš málo.','Lebo štvorce nie sú rovnako veľké.'],'Áno. Sieť musí mať každú stenu na inom mieste.'],
 dlzky:['Ema namerala na lavici 8 ceruziek, Tomáš 12 dlaní. Prečo sa ich čísla líšia?',['Lebo merali rôzne dlhými jednotkami.','Lebo jeden z nich určite klame.','Lebo lavica sa zmenila.'],'Áno. Preto používame rovnaké jednotky, napríklad centimetre.'],
 odhad:['Prečo odhad overujeme meraním?',['Odhad je len tip. Meranie ukáže skutočnú dĺžku.','Lebo odhad je vždy zlý.','Lebo meranie je rýchlejšie ako odhad.'],'Áno. A každé overenie nás naučí odhadovať lepšie.'],
 pravitko:['Prečo prikladáme nulu pravítka na začiatok úsečky?',['Lebo meriame, koľko dielikov je od začiatku po koniec.','Lebo nula je najkrajšie číslo.','Lebo pravítko inak nefunguje.'],'Áno. Keď nula chýba, spočítame dieliky.'],
 os:['Prečo uhlopriečka obdĺžnika nie je jeho os súmernosti?',['Po prehnutí sa polovice neprekryjú, rožky trčia von.','Lebo os musí byť vždy zvislá.','Lebo obdĺžnik nemá žiadnu os.'],'Áno. Os overíme prehnutím, nie iba okom.'],
 dokresli:['Prečo musí byť obraz štvorčeka rovnako ďaleko od osi?',['Lebo po prehnutí cez os sa musia presne prekryť.','Lebo tak je to krajšie.','Lebo obraz musí byť vždy ďalej od osi.'],'Áno. Obraz a vzor majú od osi rovnakú vzdialenosť.']
};

const termsHtml=()=>`<dl>${Object.entries(TERMS).map(([k,v])=>`<dt>${k}</dt><dd style="margin:0">${v}</dd>`).join('')}</dl>`;
const progressHtml=()=>{const r=Object.keys(G).filter(k=>S.st&&S.st[k]).map(k=>{const[a,b,d]=S.st[k];return `<tr><td>${G[k].title}</td><td>${a}</td><td>${b}</td><td>${d}</td></tr>`}).join('');return r?`<table class="pt"><tr><th>Hra, posledné prejdenie</th><th>samo</th><th>po chybe</th><th>ukázané riešenie</th></tr>${r}</table>`:'<p>Zatiaľ žiadna dokončená hra.</p>'};
const adultHtml=()=>`<p>Tvaríkovo je námet pre 1. cyklus (1. až 3. ročník) podľa vzdelávacích štandardov z matematiky, komponent Geometria. Vlákno, Sieťka a Pavučina sú stupne náročnosti, nie ročníky. Štandardy platia pre celý cyklus, stupeň si preto vyberte podľa dieťaťa a kedykoľvek ho zmeňte. Hry v jednej časti môžete robiť v ľubovoľnom poradí.</p>
 <h3 class="h3b">Čo dieťa robí v aplikácii</h3><h3>Cesty: orientácia v rovine a priestore</h3><ul><li><b>Kde je lienka?</b> Poloha objektov navzájom: nad, pod, na, do, vedľa, vľavo, vpravo, medzi, pred, za, vpredu, vzadu.</li><li><b>Krôčikova cesta</b> Labyrint, záznam pohybu šípkami, čítanie záznamu, dĺžka cesty, algoritmický postup.</li><li><b>Bzučkine kvety</b> Súradnice štvorcov a mriežkových bodov.</li></ul>
 <h3>Dielňa tvarov: rovinné útvary</h3><ul><li><b>Triedenie dielikov</b> Útvary v rôznych polohách a veľkostiach, počet strán a vrcholov, rovnaké a rôzne dĺžky strán, kruh a kružnica, čiary, úsečka, polpriamka, priamka, patrí a nepatrí.</li><li><b>Skladanie plástu</b> Skladanie a rozkladanie mnohouholníkov.</li><li><b>Rysovací stôl</b> Úsečka, trojuholník, štvorec, obdĺžnik v sieti, stred úsečky, prenášanie úsečky, kružnica s polomerom, trojuholníková nerovnosť manipuláciou.</li></ul>
 <h3>Stavenisko: priestorové útvary</h3><ul><li><b>Stavebný materiál</b> Telesá v okolí, triedenie, steny, hrany, vrcholy, súvislosť stien s rovinnými útvarmi. Názvy kocka, kváder, guľa, valec sa vyžadujú aktívne.</li><li><b>Stavba podľa plánu</b> Dieťa stavia priamo v otáčateľnom modeli podľa vzoru, plánu a slovného opisu. Na stupni Pavučina vytvára plán z modelu a počíta kocky, niektoré vidí až po otočení.</li><li><b>Kde je chyba?</b> Porovnanie otáčateľného modelu s plánom, oprava chyby, siete kocky.</li></ul>
 <h3>Merači: dĺžka</h3><ul><li><b>Konáre a piade</b> Porovnávanie a usporiadanie, vlastné jednotky, univerzálne jednotky a ich poradie bez premieňania.</li><li><b>Odhadni a over</b> Odhad a overenie meraním, dĺžka lomenej čiary.</li><li><b>Pravítko</b> Meranie a zostrojenie úsečky na centimetre, stred úsečky.</li></ul>
 <h3>Zrkadlový park: súmernosť</h3><ul><li><b>Prehni a pozri</b> Súmerné a nesúmerné útvary, os súmernosti, overenie prehnutím.</li><li><b>Dokresli krídlo</b> Dokresľovanie podľa zvislej a vodorovnej osi.</li><li><b>Súmerná mozaika</b> Tvorba súmernej mozaiky.</li></ul>
 <h3 class="h3b">Didaktické poznámky</h3><ul><li><b>Najprv manipulácia.</b> Dieťa ťahá, skladá a prekladá, až potom číta symbol. Ideálne si to isté skúsi s kockami, papierom a pravítkom.</li><li><b>Tvary mimo šablóny.</b> Útvary sú zámerne otočené, úzke aj nezvyčajné, aby sa dieťa neviazalo na jeden obrázok z učebnice.</li><li><b>Štvorec a obdĺžnik.</b> Každý štvorec spĺňa vlastnosti obdĺžnika. Aplikácia nikdy netvrdí opak, pri triedení používa obdĺžniky, ktoré nie sú štvorcom.</li><li><b>Kocka a kváder.</b> Kocka je zvláštny kváder. Pri triedení podľa názvov ju dávame na samostatnú kôpku, s deťmi to však môžete pokojne otvoriť.</li><li><b>Odhad nie je chyba.</b> Pri odhade sa nehodnotí správne a nesprávne, ale ako blízko je dieťa.</li><li><b>Centimetre na obrazovke</b> sú model, na každom zariadení sú inak veľké. Skutočné meranie patrí k skutočnému pravítku.</li><li><b>Pomoc nie je hanba, ale nie je to ani zvládnutie.</b> Dedinka sa opravuje aj po ukázanom riešení, aby dieťa neodradila. Pre vás je nižšie prehľad, čo zvládlo samo.</li><li><b>Chyba má význam.</b> Pri chybe dieťa dostane konkrétnu stopu, po troch chybách môže požiadať o riešenie. Na konci každej hry je otázka na rozhovor, ktorá vedie k vysvetľovaniu vlastnými slovami.</li></ul>
 <h3 class="h3b">Rozširujúce učivo</h3><ul><li>Ihlan a kužeľ sú podľa ŠVP pojmy na porozumenie. Triedenie podľa ich názvov je preto len na stupni Pavučina.</li><li>Trojuholníková nerovnosť a mriežkové body sú na náročnejších stupňoch.</li></ul><h3 class="h3b">Čo precvičiť mimo obrazovky</h3><p>Aplikácia je pomôcka, nenahrádza kocky, papier, pravítko ani rozhovor s učiteľom.</p><ul><li>poloha vzhľadom k sebe (moja ľavá ruka, predo mnou)</li><li>práca s robotickou hračkou</li><li>skladanie a strihanie papiera, modely telies zo siete</li><li>meranie skutočným pravítkom a metrom</li><li>rysovanie polpriamky a priamky ceruzkou a pravítkom (v aplikácii ich deti rozoznávajú)</li><li>vlastná tvorba siete telesa (v aplikácii deti posudzujú hotové siete kocky)</li></ul>
 <h3 class="h3b">Prehľad postupu</h3>${progressHtml()}<button class="big" data-act="reset">Vymazať postup</button><h3>Súkromie</h3><p>Postup sa ukladá len v tomto prehliadači. Aplikácia nemá registráciu a sama neodosiela údaje na žiadny server. Čítanie nahlas zabezpečuje prehliadač alebo systém zariadenia, ich správanie aplikácia neovplyvňuje.</p>
 <h3>Zvieratá</h3><p>Tvarík, Krôčik, Bzučka, Hrádzik, Piadka a Krídlik sú rozprávkové postavy. Zaujímavosti z prírody vychádzajú z reálnych pozorovaní živočíchov.</p>`;

  else if(a==='again0')speak(STORY);
  else if(a==='lvl'){S.lvl=+v;save();$$('.lvb').forEach(b=>b.setAttribute('aria-pressed',b===t))}
  else if(a==='reset'){if(t.dataset.ok){S.done={};S.seen={};S.st={};S.mosaic=null;S.party=0;save();$('.sheet').remove();$('.sheetb').remove();go('home')}else{t.dataset.ok=1;t.textContent='Naozaj vymazať celý postup?'}}
  else if(a==='play'){$('.over')&&$('.over').remove();go('game',v)}
  else if(a==='next'&&cur)cur.next();
  else if(a==='again'&&cur)cur.again();
  else if(a==='solve'&&cur){t.parentElement.remove();cur.solve()}
  else if(a==='snd'){S.snd=!S.snd;save();if(!S.snd)hush();$$('[data-act=snd]').forEach(b=>{b.innerHTML=ic(S.snd?'on':'off');b.setAttribute('aria-label',S.snd?'Vypnúť zvuk':'Zapnúť zvuk')})}
  else if(a==='terms')sheet(termsHtml(),'Slovník pojmov');
  else if(a==='adult')sheet(adultHtml(),'Pre učiteľov a rodičov');
  else if(a==='term')sheet(`<p>${TERMS[v]}</p>`,v);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cell,.st')){e.preventDefault();e.stopPropagation();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}},true);
new MutationObserver(()=>$$('.cell:not([tabindex]),.st:not([tabindex])').forEach(n=>{n.setAttribute('tabindex',0);n.setAttribute('role','button');if(!n.getAttribute('aria-label'))n.setAttribute('aria-label',n.classList.contains('st')?'Vybrať možnosť '+(+n.dataset.i+1):n.dataset.x!=null?`Políčko, stĺpec ${+n.dataset.x+1}, riadok ${+n.dataset.y+1}`:'Políčko')})).observe(app,{childList:true,subtree:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const s=$('.sheet');if(s){s.remove();$('.sheetb').remove()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('svg [data-act]')){e.preventDefault();e.target.closest('[data-act]').click()}
  cur&&cur.key(e)});
let tt;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='home')home()},120)});
let rz;function toast(m){$('.toast')&&$('.toast').remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2200)}
go('home');
</script>
</body>
